
name: Build Smart Lens AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q SmartLensAI-Android-Project.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/SmartLensAI
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartLensAI-APK
          path: extracted/SmartLensAI/app/build/outputs/apk/debug/app-debug.apk
